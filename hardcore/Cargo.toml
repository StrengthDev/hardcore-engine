[package]
name = "hardcore"
version = "0.1.0"
description = "A real-time graphical engine library powered by Vulkan."
edition = "2021"
authors = ["Pedro Valente <pedro.amaral.valente@gmail.com>"]
repository = "https://github.com/StrengthDev/hardcore-engine"
readme = "../README.md"
license-file = "../LICENSE"
publish = true

[dependencies]
glslang = { version = "0.6.1", optional = true }
hardcore-sys = { path = "../hardcore-sys" }
parking_lot = { version = "0.12.1", features = ["send_guard"], optional = true }
thiserror = "2.0.11"
tokio = { version = "1.36.0", features = ["fs", "io-util", "rt", "rt-multi-thread", "sync", "signal", "time"] }
tracing = "0.1.40"

[dev-dependencies]
tokio = { version = "1.36.0", features = ["macros"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[features]
headless = ["hardcore-sys/headless"]
tracing = ["hardcore-sys/tracing"]
parking_lot = ["dep:parking_lot", "tracing-subscriber/parking_lot", "tokio/parking_lot"]
shader-compilation = ["dep:glslang"]
validation = ["hardcore-sys/validation"]
