[package]
name = "hardcore-sys"
version = "0.1.0"
description = "Automatically generated Rust bindings to Hardcore's native module."
edition = "2021"
authors = ["Pedro Valente <pedro.amaral.valente@gmail.com>"]
repository = "https://github.com/StrengthDev/hardcore-engine"
license-file = "../LICENSE"
links = "hardcore"
exclude = []
publish = true

[dependencies]
link-cplusplus = "1.0.10"

[build-dependencies]
bindgen = "0.71.1"
cmake = "0.1.54"
regex = "1.11.1"

[features]
headless = []
tracing = []
validation = []
